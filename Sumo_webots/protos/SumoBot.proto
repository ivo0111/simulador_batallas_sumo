#VRML_SIM R2025a utf8
PROTO SumoBot [
  field SFVec3f translation 0 0.05 0.12
  field SFRotation rotation 0 1 0 0
  field SFFloat maxTorque 2
  field SFFloat maxVelocity 25
  field SFFloat density 100
  field SFString name "robot_A"
  field SFColor color 0.66667 0 0
]
{
Robot {
  translation IS translation
  rotation IS rotation
  controller "sumo_test"
  name IS name
  children [
    DEF left_motor HingeJoint {
      jointParameters HingeJointParameters {
        anchor 0.115 0.1 -0.01
      }
      device [
        RotationalMotor {
          maxTorque IS maxTorque
          maxVelocity IS maxVelocity
          name "left_motor"
        }
      ]
      endPoint Solid {
        translation 0.115 0.1 -0.01
        rotation 0.5773509358440191 0.5773489358743693 0.5773509358481794 2.0943999999657117
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
            }
            geometry Cylinder {
              height 0.03
              radius 0.05
              subdivision 20
            }
          }
        ]
        contactMaterial "robot"
        boundingObject Cylinder {
          height 0.03
          radius 0.05
          subdivision 20
        }
        physics Physics {
          density 900
        }
        linearVelocity 2.730384668502026e-13 8.219583732074781e-10 2.0887962689669587e-09
        angularVelocity 2.0554226351740373e-08 -6.958475121144432e-12 5.983293489233167e-14
      }
    }
    DEF right_motor HingeJoint {
      jointParameters HingeJointParameters {
        anchor -0.115 0.09 -0.01
      }
      device [
        RotationalMotor {
          maxTorque IS maxTorque
          maxVelocity IS maxVelocity
          name "right_motor"
          maxTorque 50
        }
      ]
      endPoint Solid {
        translation -0.115 0.09 -0.01
        rotation 0.5773493024111532 0.5773522027372134 0.5773493024156542 2.0943880996826088
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
            }
            geometry Cylinder {
              height 0.03
              radius 0.05
              subdivision 20
            }
          }
        ]
        name "solid(1)"
        contactMaterial "robot"
          boundingObject Cylinder {
            height 0.03
            radius 0.05
            subdivision 20
          }
        physics Physics {
          density 900
        }
        linearVelocity 2.732178801295507e-13 7.937365638217227e-10 2.1117697694232178e-09
        angularVelocity -3.287499099045101e-05 -7.240622932811722e-12 -2.8812626771839243e-11
      }
    }
    DEF irLeft DistanceSensor {
      name "line_left"
      translation 0.05 -0.11 -0.045
      rotation 0 1 0 1.5708
      type "infra-red"
    }
    DEF irRight DistanceSensor {
      name "line_right"
      translation -0.05 -0.11 -0.045
      rotation 0 1 0 1.5708
      type "infra-red"
    }
    DEF ultraSonido DistanceSensor {
      name "front_ir"
      translation 0 -0.15 0
      rotation 0 0 1 -1.5708
      type "generic"
      lookupTable [
        0  1000 0
        1.0   800 0
        2.0   500 0
        4.0   100 0
      ]
    }     
    DEF body Shape {
      appearance PBRAppearance {
        baseColor IS color
        metalness 0.5
      }
      geometry DEF body_geo Box {
        size 0.2 0.2 0.1
      }
    }
    DEF patin Shape {
      geometry Sphere {
        radius 0.02
      }
      appearance PBRAppearance {
        baseColor 0.666667 0 0
        metalness 0.5
      }
    } 
    DEF rampa Shape {
      appearance PBRAppearance {
        baseColor 0.4 0.4 0.4
        roughness 0.4
      }
      geometry DEF rampa_geo IndexedFaceSet {
        coord Coordinate {
          point [
            -0.1  -0.1 0.05   # 0 back right top
              0.1  -0.1 0.05   # 1 back left top
    
              0.1 -0.18 -0.048   # 2 front left top
            -0.1 -0.18 -0.048   # 3 front right top
    
            -0.1  -0.1 -0.05   # 4 back right bottom
              0.1  -0.1 -0.05   # 5 back left bottom
              
              0.1 -0.18 -0.05   # 6 front left bottom
            -0.1 -0.18 -0.05   # 7 front right bottom
          ]
        }
    
        coordIndex [
          1 0 3 2 -1   # top slope
          0 1 5 4 -1   # back face
          4 5 6 7 -1   # bottom
          4 7 3 0 -1   # right
          2 6 5 1 -1   # left
          2 3 7 6 -1   # front 
        ]
        ccw TRUE
      }
    }
  ]
  contactMaterial "robot"
  boundingObject Group {
    children [
      USE rampa_geo
      USE body_geo
    ]
  }
  physics Physics {
    density IS density
  }
}
}
